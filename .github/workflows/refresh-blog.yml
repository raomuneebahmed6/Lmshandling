name: Refresh blogs (Claude)

# Auto-update. Runs every Monday and whenever someone presses "Auto-update" in
# the Blog Studio admin. Claude refreshes stale posts, a safety validator
# checks each result, and the proposals are pushed to the non-deployed
# `blog-drafts` branch (drafts/refresh/). Nothing goes live until a person
# approves it in Blog Studio -> Drafts & Review.

run-name: "Refresh blogs ${{ inputs.slugs || 'weekly' }}"

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC = 08:00 Pakistan time
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated post slugs, or 'auto' to pick the stalest"
        required: true
        default: "auto"
      requested_by:
        description: "Blog Studio user who asked for it"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: refresh-blog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          ref: claude/website-blogs-seo-3jpp70
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Choose the posts to refresh
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SLUGS_IN: ${{ inputs.slugs }}
        run: |
          set -e
          # posts that already have an update waiting are skipped
          EXCLUDE=""
          if git fetch -q origin blog-drafts 2>/dev/null; then
            EXCLUDE=$(git ls-tree --name-only origin/blog-drafts drafts/refresh/ 2>/dev/null | sed -E 's#.*/##; s#\.(md|html)$##' | tr '\n' ' ')
          fi
          if [ "$EVENT" = "schedule" ] || [ "$SLUGS_IN" = "auto" ] || [ -z "$SLUGS_IN" ]; then
            SLUGS=$(EVENT="$EVENT" EXCLUDE="$EXCLUDE" node scripts/pick-stale.js)
          else
            SLUGS="$SLUGS_IN"
          fi
          if [ -n "$SLUGS" ] && ! echo "$SLUGS" | grep -Eq '^[a-z0-9,-]+$'; then echo "Invalid slug list"; exit 1; fi
          echo "Chosen: ${SLUGS:-none}"
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Set today's date
        if: steps.pick.outputs.slugs != ''
        run: |
          echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"
          mkdir -p drafts/refresh

      - name: Refresh with Claude
        if: steps.pick.outputs.slugs != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(cp:*),Bash(mkdir:*),Bash(node scripts/validate-refresh.js:*),Bash(node scripts/validate-post.js:*)"
          prompt: |
            Follow `.github/blog-refresh-prompt.md` exactly.

            SLUGS: ${{ steps.pick.outputs.slugs }}
            TODAY: ${{ env.TODAY }}

      - name: Validate every proposal (gate)
        if: steps.pick.outputs.slugs != ''
        id: gate
        run: |
          ok=0; bad=0
          for f in drafts/refresh/*.md drafts/refresh/*.html; do
            [ -e "$f" ] || continue
            slug=$(basename "$f"); slug="${slug%.*}"
            if node scripts/validate-refresh.js "$slug" "$f"; then ok=$((ok+1)); else bad=$((bad+1)); rm -f "$f"; fi
          done
          echo "valid=$ok rejected=$bad"
          echo "valid=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" -eq 0 ]; then echo "No valid proposal was produced"; exit 1; fi

      - name: Push proposals to the blog-drafts branch
        if: steps.pick.outputs.slugs != '' && steps.gate.outputs.valid != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUGS: ${{ steps.pick.outputs.slugs }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/out/drafts/refresh"
          cp drafts/refresh/* "$RUNNER_TEMP/out/drafts/refresh/"
          rm -rf "$RUNNER_TEMP/d" && mkdir "$RUNNER_TEMP/d" && cd "$RUNNER_TEMP/d"
          git init -q
          git config user.name "blog-refresh"
          git config user.email "blog-refresh@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin blog-drafts; then git checkout -q -B blog-drafts FETCH_HEAD; else git checkout -q --orphan blog-drafts; fi
          mkdir -p drafts/refresh && cp "$RUNNER_TEMP/out/drafts/refresh/"* drafts/refresh/
          git add drafts
          git commit -q -m "[auto] Refresh proposals: $SLUGS"
          git push -q origin blog-drafts
