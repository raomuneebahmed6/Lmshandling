# Decap CMS configuration for lmshandling.com
#
# Collections are added here incrementally as each content type's Eleventy
# template is built and validated (see eleventy.config.js / _includes/layouts/).
# Only "Blog Posts" is wired up so far.

backend:
  name: github
  repo: raomuneebahmed6/Lmshandling
  branch: claude/website-blogs-seo-3jpp70
  # Decap needs an OAuth app + a small token-exchange proxy to let the
  # dashboard log in with GitHub (this is NOT set up yet — see the
  # deployment phase of the CMS project). Until base_url/auth_endpoint are
  # configured, this login screen will show a GitHub button that doesn't
  # yet work. Nothing else in this file depends on that being finished.
  # base_url: https://<your-oauth-proxy-domain>
  # auth_endpoint: auth

# Where uploaded images go, and the URL path used to reference them from
# content. assets/blog-images/ already holds every existing blog post's
# cover image, so new uploads land in the same place new posts already use.
media_folder: "assets/blog-images"
public_folder: "/assets/blog-images"

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{category}}"
    sortable_fields: ["datePublished", "title"]
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/blog-post.njk" }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: "/blog/{{ canonicalSlug }}.html" }

      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Used in the browser tab and search results. Keep it under 60 characters including \" | Nibaha Haq\", which is added automatically."

      - label: "Meta Description"
        name: "metaDescription"
        widget: "text"
        hint: "The snippet shown under the title in Google search results. 70-160 characters works best."

      - label: "Keywords"
        name: "keywords"
        widget: "list"
        hint: "A handful of search terms this post should rank for."

      - label: "URL Slug"
        name: "canonicalSlug"
        widget: "string"
        hint: "The web address for this post: lmshandling.com/blog/THIS-TEXT. Use lowercase words separated by hyphens, e.g. vu-gdb-submission-format-guide. Cannot be changed after publishing without breaking the link."

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Course Code Guides", value: "course-code-guides" }
          - { label: "Exam Preparation", value: "exam-preparation" }
          - { label: "LMS Handling", value: "lms-handling" }
          - { label: "Admissions", value: "admissions" }
          - { label: "Final Year Project", value: "final-year-project" }
          - { label: "Registration", value: "registration" }

      - label: "Cover Image"
        name: "ogImage"
        widget: "image"
        hint: "1200x630 recommended. Shown on the blog listing card and when the link is shared on WhatsApp/social media."

      - label: "Date Published"
        name: "datePublished"
        widget: "date"
        date_format: "YYYY-MM-DD"
        format: "YYYY-MM-DD"

      - label: "Date Modified"
        name: "dateModified"
        widget: "date"
        date_format: "YYYY-MM-DD"
        format: "YYYY-MM-DD"
        hint: "Update this whenever you edit a published post."

      - label: "Read Time (minutes)"
        name: "readTime"
        widget: "number"
        valueType: "int"
        min: 1
        max: 30
        default: 5

      - label: "Heading (H1)"
        name: "h1"
        widget: "string"
        hint: "The large title shown at the top of the post. Can be longer/more descriptive than the browser-tab Title above."

      - label: "Lead Paragraph"
        name: "leadParagraph"
        widget: "text"
        hint: "The intro sentence right under the heading."

      - label: "Quick Answer"
        name: "quickAnswer"
        widget: "text"
        hint: "A short, self-contained answer (ideally 40-70 words) shown in a highlighted box near the top. Write it so it makes sense on its own, since this is the part AI search results and Google often quote directly."

      - label: "Table of Contents"
        name: "tocEntries"
        widget: "list"
        hint: "One entry per heading in the post body below. The anchor must exactly match a heading's id in the body (e.g. anchor \"gdb-format\" needs a heading like <h2 id=\"gdb-format\"> in the body)."
        fields:
          - { label: "Anchor (no spaces)", name: "anchor", widget: "string" }
          - { label: "Label", name: "label", widget: "string" }

      - label: "Key Takeaways"
        name: "keyTakeaways"
        widget: "list"
        hint: "Short bullet points summarizing the post, shown near the end."

      - label: "FAQ"
        name: "faq"
        widget: "list"
        hint: "Each question/answer pair shows as an expandable item and also helps this post appear in Google's FAQ-style results."
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

      - label: "Tags"
        name: "tags"
        widget: "list"
        hint: "Short topic labels shown as chips at the end of the post."

      - label: "Related Guides"
        name: "relatedGuides"
        widget: "list"
        hint: "Links to other pages on the site worth reading next."
        fields:
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Label", name: "label", widget: "string" }

      - label: "Cover Card: Eyebrow Line"
        name: "coverEyebrow"
        widget: "string"
        default: "NIBAHA HAQ 0329 5209868"
        hint: "Small text at the top of the dark cover-card graphic on the post."

      - label: "Cover Card: Highlight Lines"
        name: "coverHighlights"
        widget: "list"
        hint: "2-3 short, punchy lines (ALL CAPS reads best) shown on the cover card, e.g. \"GDB FORMAT 2026\"."

      - label: "Cover Card: Contact Line"
        name: "coverContactLine"
        widget: "string"
        default: "FOR VULMS SUPPORT, CONTACT 03295209868"

      - label: "Cover Card: Button Text"
        name: "coverCtaText"
        widget: "string"
        hint: "e.g. \"Get Help: VU GDB\""

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "The main content of the post. Use ## for section headings (add an id like {#my-section} isn't supported here, so for a heading that needs to match a Table of Contents anchor, write it as raw HTML instead: <h2 id=\"my-section\">Heading text</h2>)."
