name = "lmshandling-cms-oauth"
main = "worker.js"
compatibility_date = "2024-01-01"

# Serve the OAuth handshake from the site's own domain, so the GitHub OAuth app's
# callback URL (https://lmshandling.com/callback) and the Blog Studio popup are
# same-origin. Cloudflare proxies lmshandling.com, so these two paths are
# answered by this Worker and everything else still goes to Hostinger.
routes = [
  { pattern = "lmshandling.com/auth*", zone_name = "lmshandling.com" },
  { pattern = "lmshandling.com/callback*", zone_name = "lmshandling.com" }
]
